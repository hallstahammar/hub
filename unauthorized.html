<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Åtkomst saknas - Hallstahammar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <style>
        :root {
            /* LJUST LÄGE */
            --bg-color: #fdfdfd;
            --card-bg: #f3f4f9;
            --text-main: #1b1b1f;
            --text-sub: #44474e;
            --primary: #3f51b5;
            --on-primary: #ffffff;
            --icon-color: #44474e; /* Neutral grå för hänglåset */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* MÖRKT LÄGE */
                --bg-color: #111318;
                --card-bg: #1a1c22;
                --text-main: #e2e2e6;
                --text-sub: #c4c6d0;
                --primary: #b4c5ff;
                --on-primary: #001a40;
                --icon-color: #c4c6d0;
            }
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .logo-container {
            width: 100%;
            max-width: 200px;
            margin-bottom: 32px;
            opacity: 0.8;
        }
        .logo-container img { width: 100%; height: auto; display: block; }
        
        .logo-dark { display: none !important; }
        .logo-light { display: block !important; }
        @media (prefers-color-scheme: dark) {
            .logo-dark { display: block !important; }
            .logo-light { display: none !important; }
        }

        .message-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 48px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .icon-large {
            font-size: 64px;
            color: var(--icon-color);
            margin-bottom: 24px;
            font-variation-settings: 'FILL' 0, 'wght' 300;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 16px 0;
            color: var(--text-main);
            font-weight: 400;
        }

        p {
            font-size: 1rem;
            color: var(--text-sub);
            margin: 0 0 32px 0;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            height: 48px;
            border-radius: 24px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--on-primary);
        }
        .btn-primary:hover { box-shadow: 0 2px 5px rgba(0,0,0,0.2); opacity: 0.95; }

        .btn-text {
            background-color: transparent;
            color: var(--primary);
        }
        .btn-text:hover { background-color: rgba(63, 81, 181, 0.08); } /* Lätt tint vid hover */
        @media (prefers-color-scheme: dark) {
            .btn-text:hover { background-color: rgba(180, 197, 255, 0.08); }
        }

    </style>
</head>
<body>

    <header class="logo-container">
        <img src="https://karta.hallstahammar.se/Liggande logotyp.svg" class="logo-light" alt="Hallstahammars kommun">
        <img src="https://karta.hallstahammar.se/Liggande logotyp white.svg" class="logo-dark" alt="Hallstahammars kommun">
    </header>

    <main class="message-card">
        <span class="material-symbols-outlined icon-large">lock_person</span>
        
        <h1>Åtkomst saknas</h1>
        
        <p>
            Ditt konto saknar behörighet för att visa den här sidan. 
            Detta beror oftast på att du inte tillhör rätt behörighetsgrupp.
        </p>

        <div class="btn-group">
            <a href="/intern" class="btn btn-primary">
                Till startsidan
            </a>
            
            </div>
    </main>

</body>
</html>
